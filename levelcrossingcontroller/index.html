<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Level Crossing Controller</title>
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div id="hud">
      <div id="score">Score: 0</div>
      <div id="barrier-status">Barrier: UP</div>
    </div>

    <div id="warning-banner">TRAIN APPROACHING</div>

    <button id="barrier-btn">Lower Barrier (Space)</button>

    <div id="overlay">
      <h1>Level Crossing Controller</h1>
      <p>
        You are the signalman. Lower the barrier before a train arrives,
        raise it once the line is clear, and never leave a car trapped on
        the tracks.
      </p>
      <p class="hint">Space, or the button in the corner, toggles the barrier.</p>
      <button id="start">Start</button>
    </div>

    <div id="gameover" class="hidden">
      <h1>Collision!</h1>
      <p id="final-score"></p>
      <button id="restart">Try Again (R)</button>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
